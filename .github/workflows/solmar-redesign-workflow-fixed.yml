name: Apply Clínica Solmar complete redesign

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type APPLY to replace the current website files
        required: true
        type: string

permissions:
  contents: write

jobs:
  redesign:
    if: ${{ github.event.inputs.confirm == 'APPLY' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install complete redesigned website
        env:
          INDEX_HTML_B64: ""
          STYLES_CSS_B64: ""
          STYLES_CSS_B64: ""
          MAIN_JS_B64: ""
          README_MD_B64: ""
        run: |
          python - <<'PYCODE'
          import base64, os
          from pathlib import Path
          files = {
              "index.html": "INDEX_HTML_B64",
              "styles.css": "STYLES_CSS_B64",
              "main.js": "MAIN_JS_B64",
              "README.md": "README_MD_B64",
          }
          for filename, key in files.items():
              Path(filename).write_bytes(base64.b64decode(os.environ[key]))
              print(f"Installed {filename}")
          PYCODE
      - name: Commit and push redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css main.js README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Apply complete Clínica Solmar visual redesign"
          git push
