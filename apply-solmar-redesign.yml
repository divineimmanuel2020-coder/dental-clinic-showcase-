        run: |
          python - <<'PYCODE'
          import base64, io, os, zipfile
          from pathlib import Path

          payload = base64.b64decode(os.environ["REDESIGN_ZIP_B64"])
          expected = {"index.html", "styles.css", "main.js", "README.md"}
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              names = set(archive.namelist())
              if names != expected:
                  raise SystemExit(f"Unexpected ZIP contents: {sorted(names)}")
              for name in sorted(expected):
                  data = archive.read(name)
                  Path(name).write_bytes(data)
                  print(f"Installed {name} ({len(data)} bytes)")
          PYCODE

      - name: Commit and push the redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css main.js README.md
          if git diff --cached --quiet; then
            echo "The redesign files are already up to date. No commit needed."
            exit 0
          fi
          git commit -m "Apply Clínica Solmar website redesign"
          git push origin "HEAD:${GITHUB_REF_NAME}"
