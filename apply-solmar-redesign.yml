name: Apply Clínica Solmar redesign

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY to replace the website files with the redesign"
        required: true
        type: string
        default: "APPLY"

permissions:
  contents: write

concurrency:
  group: apply-solmar-redesign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-redesign:
    if: github.event.inputs.confirm == 'APPLY'
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

